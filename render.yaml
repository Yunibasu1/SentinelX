# Blueprint de Render para desplegar el backend de SentinelX (plan gratuito)
# Cómo usarlo:
#   1. Entra en https://render.com -> New -> Blueprint (conecta el repo GitHub SentinelX)
#   2. Render detecta este render.yaml y crea el servicio "sentinelx-backend"
#   3. Te pedirá los valores de las variables marcadas con "sync: false" -> pega los que tienes en backend/.env
#   4. Deploy -> espera a que termine (el plan gratis se duerme tras 15 min de inactividad)
services:
  - type: web
    name: sentinelx-backend
    runtime: python
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Versión de Python: la 3.14 (default) no compila pydantic-core 2.27 -> usamos 3.12
      - key: PYTHON_VERSION
        value: "3.12.11"
      # Base de datos PostgreSQL gratuita en Neon (https://neon.tech)
      # Crea un proyecto y copia su connection string: postgresql://user:pass@host/db
      - key: DATABASE_URL
        sync: false
      # Genera una con: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: SECRET_KEY
        sync: false
      # Clave de Groq (https://console.groq.com)
      - key: GROQ_API_KEY
        sync: false
      # Dominio de tu frontend en Vercel (se añade a los orígenes CORS)
      - key: CORS_ORIGINS
        sync: false
      # Opcional: correo de avisos
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PASSWORD
        sync: false
