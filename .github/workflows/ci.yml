name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verificar importacion de la app
        run: python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; print('OK: app importable')"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Typecheck TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Compilar produccion
        working-directory: frontend
        run: npm run build
